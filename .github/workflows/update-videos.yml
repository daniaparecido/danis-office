name: Update Video Stats

on:
  # Mirror the sheets right after the tracker has written fresh numbers into them.
  # Fires whatever the tracker's conclusion, so one failing platform does not hold
  # back the others' fresh stats.
  workflow_run:
    workflows: ["Update Tracker Stats"]
    types: [completed]
  # Allow manual trigger
  workflow_dispatch:

# Never let two mirrors push at once (a manual run overlapping a chained one).
concurrency:
  group: update-video-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # git push
      actions: write   # dispatch deploy.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Sync library + projects.js
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/sync_from_sheet.py

      - name: Check for changes
        id: git-check
        run: |
          if ! git diff --quiet data/library.json js/projects.js; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/library.json js/projects.js
          git commit -m "Update video stats [automated]"
          git push

      # A push made with GITHUB_TOKEN never triggers deploy.yml's `on: push`, so
      # without this the new stats sit in the repo and the live site never changes.
      # workflow_dispatch is the one event GITHUB_TOKEN is allowed to fire.
      - name: Deploy to GitHub Pages
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
